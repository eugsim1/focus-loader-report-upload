name: linux-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CGO compiler
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Verify modules
        run: go mod verify

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Install Streamlit dependencies
        working-directory: streamlit-ui
        run: python -m pip install -r requirements-dev.txt

      - name: Test Streamlit support modules
        working-directory: streamlit-ui
        run: python -m unittest discover -s tests -v

      - name: Compile Streamlit source
        working-directory: streamlit-ui
        run: python -m compileall -q app.py focus_api.py command_builder.py tests

      - name: Validate deployment shell scripts
        run: bash -n scripts/install-streamlit-ui.sh sql_scripts/deploy_focus_schema_with_sqlloader_audit.sh

      - name: Validate PowerShell Windows authentication launchers
        shell: pwsh
        run: |
          $scriptPath = 'linux8-streamlit-bastion/connect-streamlit-bastion.ps1'
          $browserScript = 'windows-browser-auth-streamlit/connect-streamlit-browser-auth.ps1'
          $apiKeyScript = 'windows-api-key-auth-streamlit/connect-streamlit-api-key-auth.ps1'
          foreach ($candidate in @($scriptPath, $browserScript, $apiKeyScript)) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $candidate),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell parser validation failed for $candidate."
            }
          }

          $privateKey = Join-Path $env:RUNNER_TEMP 'test_bastion_key'
          $publicKey = "${privateKey}.pub"
          $apiPrivateKey = Join-Path $env:RUNNER_TEMP 'test_oci_api_key.pem'
          Set-Content -LiteralPath $privateKey -Value 'TEST-ONLY-PRIVATE-KEY'
          Set-Content -LiteralPath $publicKey -Value 'ssh-ed25519 AAAATESTONLY'
          Set-Content -LiteralPath $apiPrivateKey -Value 'TEST-ONLY-API-PRIVATE-KEY'
          & $scriptPath `
            -BastionId 'ocid1.bastion.oc1.eu-frankfurt-1.testbastion' `
            -InstanceId 'ocid1.instance.oc1.eu-frankfurt-1.testinstance' `
            -PrivateIp '10.30.1.10' `
            -Region 'eu-frankfurt-1' `
            -SshPrivateKeyPath $privateKey `
            -LocalPort 18501 `
            -DryRun

          & $browserScript `
            -BastionId 'ocid1.bastion.oc1.eu-frankfurt-1.testbastion' `
            -InstanceId 'ocid1.instance.oc1.eu-frankfurt-1.testinstance' `
            -PrivateIp '10.30.1.10' `
            -Region 'eu-frankfurt-1' `
            -SshPrivateKeyPath $privateKey `
            -LocalPort 18502 `
            -DryRun

          & $apiKeyScript `
            -BastionId 'ocid1.bastion.oc1.eu-frankfurt-1.testbastion' `
            -InstanceId 'ocid1.instance.oc1.eu-frankfurt-1.testinstance' `
            -PrivateIp '10.30.1.10' `
            -Region 'eu-frankfurt-1' `
            -SshPrivateKeyPath $privateKey `
            -OciUserId 'ocid1.user.oc1..testuser' `
            -OciTenancyId 'ocid1.tenancy.oc1..testtenancy' `
            -ApiKeyFingerprint 'aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99' `
            -ApiPrivateKeyPath $apiPrivateKey `
            -OciConfigFilePath (Join-Path $env:RUNNER_TEMP 'dry-run-oci-config') `
            -LocalPort 18503 `
            -DryRun

          $ociMock = Join-Path $env:RUNNER_TEMP 'oci-mock'
          $mockSource = @'
          #!/usr/bin/env bash
          case "$1 $2 $3" in
            "bastion bastion get")
              printf '%s\n' '{"data":{"lifecycle-state":"ACTIVE"}}'
              ;;
            "bastion session create-managed-ssh")
              printf '%s\n' '{}'
              ;;
            "bastion session list")
              printf '%s\n' '{"data":[{"id":"ocid1.bastionsession.oc1.eu-frankfurt-1.test"}]}'
              ;;
            "bastion session get")
              printf '%s\n' '{"data":{"lifecycle-state":"ACTIVE"}}'
              ;;
            "bastion session delete")
              printf '%s\n' '{}'
              ;;
            "session validate --profile")
              printf '%s\n' 'Session is valid'
              ;;
            *)
              printf 'Unexpected OCI command: %s\n' "$*" >&2
              exit 65
              ;;
          esac
          '@
          Set-Content -LiteralPath $ociMock -Value $mockSource -NoNewline
          & chmod +x $ociMock

          & $scriptPath `
            -BastionId 'ocid1.bastion.oc1.eu-frankfurt-1.testbastion' `
            -InstanceId 'ocid1.instance.oc1.eu-frankfurt-1.testinstance' `
            -PrivateIp '10.30.1.10' `
            -Region 'eu-frankfurt-1' `
            -SshPrivateKeyPath $privateKey `
            -OciExecutable $ociMock `
            -SshExecutable '/usr/bin/true' `
            -LocalPort 18504 `
            -WaitSeconds 60 `
            -PollSeconds 1

          & $browserScript `
            -BastionId 'ocid1.bastion.oc1.eu-frankfurt-1.testbastion' `
            -InstanceId 'ocid1.instance.oc1.eu-frankfurt-1.testinstance' `
            -PrivateIp '10.30.1.10' `
            -Region 'eu-frankfurt-1' `
            -SshPrivateKeyPath $privateKey `
            -UseExistingSession `
            -OciExecutable $ociMock `
            -SshExecutable '/usr/bin/true' `
            -LocalPort 18505 `
            -WaitSeconds 60 `
            -PollSeconds 1

          $apiConfig = Join-Path $env:RUNNER_TEMP 'api-key-oci-config'
          & $apiKeyScript `
            -BastionId 'ocid1.bastion.oc1.eu-frankfurt-1.testbastion' `
            -InstanceId 'ocid1.instance.oc1.eu-frankfurt-1.testinstance' `
            -PrivateIp '10.30.1.10' `
            -Region 'eu-frankfurt-1' `
            -SshPrivateKeyPath $privateKey `
            -OciUserId 'ocid1.user.oc1..testuser' `
            -OciTenancyId 'ocid1.tenancy.oc1..testtenancy' `
            -ApiKeyFingerprint 'aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99' `
            -ApiPrivateKeyPath $apiPrivateKey `
            -OciConfigFilePath $apiConfig `
            -OciExecutable $ociMock `
            -SshExecutable '/usr/bin/true' `
            -LocalPort 18506 `
            -WaitSeconds 60 `
            -PollSeconds 1

          $profileText = Get-Content -LiteralPath $apiConfig -Raw
          foreach ($expected in @(
            '[STREAMLIT_API_KEY]',
            'user=ocid1.user.oc1..testuser',
            'tenancy=ocid1.tenancy.oc1..testtenancy',
            'fingerprint=aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99'
          )) {
            if (-not $profileText.Contains($expected)) {
              throw "Generated API-key profile is missing: $expected"
            }
          }

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build -buildvcs=false -trimpath -o dist/focus-loader-report-upload-linux-amd64 .
