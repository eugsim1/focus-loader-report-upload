name: linux-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CGO compiler
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Verify modules
        run: go mod verify

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Install Streamlit dependencies
        working-directory: streamlit-ui
        run: python -m pip install -r requirements-dev.txt

      - name: Test Streamlit support modules
        working-directory: streamlit-ui
        run: python -m unittest discover -s tests -v

      - name: Compile Streamlit source
        working-directory: streamlit-ui
        run: python -m compileall -q app.py focus_api.py command_builder.py tests

      - name: Validate PowerShell Bastion launcher
        shell: pwsh
        run: |
          $scriptPath = 'linux8-streamlit-bastion/connect-streamlit-bastion.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $scriptPath),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw 'PowerShell parser validation failed.'
          }

          $privateKey = Join-Path $env:RUNNER_TEMP 'test_bastion_key'
          $publicKey = "${privateKey}.pub"
          Set-Content -LiteralPath $privateKey -Value 'TEST-ONLY-PRIVATE-KEY'
          Set-Content -LiteralPath $publicKey -Value 'ssh-ed25519 AAAATESTONLY'
          & $scriptPath `
            -BastionId 'ocid1.bastion.oc1.eu-frankfurt-1.testbastion' `
            -InstanceId 'ocid1.instance.oc1.eu-frankfurt-1.testinstance' `
            -PrivateIp '10.30.1.10' `
            -Region 'eu-frankfurt-1' `
            -SshPrivateKeyPath $privateKey `
            -LocalPort 18501 `
            -DryRun

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build -buildvcs=false -trimpath -o dist/focus-loader-report-upload-linux-amd64 .
