name: linux-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO compiler
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Verify modules
        run: go mod verify

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build -buildvcs=false -trimpath -o dist/focus-loader-report-upload-linux-amd64 .
